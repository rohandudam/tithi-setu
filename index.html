<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0e1a" />
    <meta name="description" content="Convert a calendar date to its Hindu tithi, or find the date of a tithi in any year." />

    <meta name="robots" content="noindex" />
    <title>Tithi Setu — date and tithi converter</title>
    <link rel="stylesheet" crossorigin href="./assets/index-e73VAn32.css">
  </head>
  <body>
    <div id="root"><form id="login" class="login" hidden>
        <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#171b33"/><path d="M16 5a11 11 0 0 1 0 22 16 16 0 0 0 0-22z" fill="#ffd27a"/></svg>
        <h1>Tithi Setu</h1>
        <p>Log in to continue.</p>
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <p id="login-error" class="login-error" role="alert"></p>
        <button type="submit" class="primary">Log in</button>
      </form></div>
  <script type="module">// Runs in the deployed login page: unlocks the encrypted app with the shared username and password.
const FILE = 'assets/app-d76e9c7abd.bin'
const ITERATIONS = 600000
const KEY_NAME = 'tithi.key'

const form = document.getElementById('login')
const username = document.getElementById('username')
const password = document.getElementById('password')
const error = document.getElementById('login-error')
const submit = form.querySelector('button')

function recall() {
  try {
    return localStorage.getItem(KEY_NAME)
  } catch {
    return null
  }
}

function remember(value) {
  try {
    if (value) localStorage.setItem(KEY_NAME, value)
    else localStorage.removeItem(KEY_NAME)
  } catch {
    // The login is simply asked for again next time.
  }
}

const toBase64 = (bytes) => btoa(String.fromCharCode(...bytes))
const fromBase64 = (text) => Uint8Array.from(atob(text), (c) => c.charCodeAt(0))

async function loadPayload() {
  const response = await fetch(FILE)
  if (!response.ok) throw new Error(`HTTP ${response.status}`)
  const data = new Uint8Array(await response.arrayBuffer())
  return { salt: data.slice(0, 16), iv: data.slice(16, 28), sealed: data.slice(28) }
}

async function deriveKey(user, secret, salt) {
  const login = new TextEncoder().encode(`${user.trim().toLowerCase()}\n${secret}`)
  const base = await crypto.subtle.importKey('raw', login, 'PBKDF2', false, ['deriveBits'])
  const params = { name: 'PBKDF2', hash: 'SHA-256', salt, iterations: ITERATIONS }
  return new Uint8Array(await crypto.subtle.deriveBits(params, base, 256))
}

async function decrypt(rawKey, { iv, sealed }) {
  const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt'])
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, sealed))
}

function start(code) {
  const script = document.createElement('script')
  script.type = 'module'
  script.textContent = code
  document.body.append(script)
}

function showForm(message = '') {
  form.hidden = false
  error.textContent = message
  submit.disabled = false
  submit.textContent = 'Log in'
  ;(username.value ? password : username).focus()
}

form.addEventListener('submit', async (event) => {
  event.preventDefault()
  submit.disabled = true
  submit.textContent = 'Logging in…'
  error.textContent = ''
  try {
    const payload = await loadPayload()
    const key = await deriveKey(username.value, password.value, payload.salt)
    const code = await decrypt(key, payload)
    remember(toBase64(key))
    start(code)
  } catch (e) {
    showForm(e.name === 'OperationError' ? 'Wrong username or password.' : 'Could not load the app. Check your connection.')
    password.select()
  }
})

async function resume() {
  const saved = recall()
  if (!saved) return showForm()
  try {
    start(await decrypt(fromBase64(saved), await loadPayload()))
  } catch (e) {
    // New login details invalidate the saved key on every device.
    if (e.name === 'OperationError') remember(null)
    showForm()
  }
}

resume()
</script>
  </body>
</html>
